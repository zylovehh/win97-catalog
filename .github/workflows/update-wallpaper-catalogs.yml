name: update-wallpaper-catalogs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify catalog files
        env:
          ROOT_URL: https://aka.doubaocdn.com/s/YcNqMYua7i
          CAMLO_URL: https://aka.doubaocdn.com/s/9qseVi9kTR
        run: |
          set -euxo pipefail
          mkdir -p wallpapers
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 -o catalog.json "$ROOT_URL"
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 300 -o wallpapers/catalog.json "$CAMLO_URL"
          sha256sum -c <<'EOF'
          b15dfab8297a049a29a3bc8fe068e8fa8c026d6a1c6672631c6a912204d25ec5  catalog.json
          5961ade8dc8bfe9623eda2e2fdfb7574c5967e5c01c7e50c9b44296ba4808c2f  wallpapers/catalog.json
          EOF

      - name: Commit catalog updates
        run: |
          git config user.name "zylovehh"
          git config user.email "116480868+zylovehh@users.noreply.github.com"
          git add catalog.json wallpapers/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update wallpaper catalog entries"
            git push
          fi
